#
# Do not edit this file directly - update examples/update-antora-ui-spring.yml
# there and re-run the rollout, otherwise your change will be overwritten.

name: Update Antora UI Spring

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0/5 * * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write
  contents: write

jobs:
  update-antora-ui-spring:
    name: Update on Supported Branches
    if: ${{ github.repository_owner == 'ngocnhan-tran1996' }}
    runs-on: ubuntu-latest
    steps:
      - uses: spring-io/spring-doc-actions/update-antora-spring-ui@415e2b11a766ba64799fffb5c97a4f7e17f677cf # v0.0.22
        name: Update
        with:
          docs-branch: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          antora-file-path: 'docs/antora-playbook.yml'
  update-antora-ui-spring-docs-build:
    name: Update on docs-build
    if: ${{ github.repository_owner == 'ngocnhan-tran1996' }}
    runs-on: ubuntu-latest
    steps:
      - uses: spring-io/spring-doc-actions/update-antora-spring-ui@415e2b11a766ba64799fffb5c97a4f7e17f677cf # v0.0.22
        name: Update
        with:
          docs-branch: 'docs-build'
          token: ${{ secrets.GITHUB_TOKEN }}
